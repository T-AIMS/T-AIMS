# =====================================================================
# T-AIMS MOSQUITTO PRODUCTION HARDENED CONFIGURATION
# Penanggung Jawab : Wafian (DevOps, Server & Security Engineer)
# File             : devops/mosquitto/mosquitto.prod.conf
# =====================================================================

# 1. Persistence & Logging
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# 2. Authentication & Authorization (Production Hardened)
# WAJIB: allow_anonymous dimatikan di production!
allow_anonymous false
password_file /mosquitto/config/passwd

# 3. Standard MQTT Listener (Internal / Container Network)
listener 1883 0.0.0.0

# 4. WebSocket Listener (Frontend / Web Dashboard)
listener 9001 0.0.0.0
protocol websockets

# 5. Secure MQTTS Listener (Opsional bila sertifikat di-mount)
# listener 8883 0.0.0.0
# cafile /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key

# =====================================================================
# PANDUAN GENERATE PASSWORD FILE:
# Jalankan perintah di bawah ini di dalam container atau host:
#   docker exec -it taims-mosquitto mosquitto_passwd -c -b /mosquitto/config/passwd taims-broker taims-mqtt-2026
