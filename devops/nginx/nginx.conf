# =====================================================================
# T-AIMS REVERSE PROXY & SSL TERMINATION CONFIGURATION
# Penanggung Jawab : Wafian (DevOps, Server & Security Engineer)
# File             : devops/nginx/nginx.conf
# =====================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Upstream Definitions
    upstream taims_backend {
        server backend:3000;
        keepalive 32;
    }

    upstream taims_frontend {
        server frontend:3001;
        keepalive 32;
    }

    upstream taims_mqtt_ws {
        server mosquitto:9001;
    }

    # -----------------------------------------------------------------
    # HTTP Server (Redirect all traffic to HTTPS)
    # -----------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name taims.teknolab.id localhost;

        # Let's Encrypt ACME Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -----------------------------------------------------------------
    # HTTPS Server (SSL/TLS Hardened)
    # -----------------------------------------------------------------
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name taims.teknolab.id localhost;

        # SSL Certificates
        ssl_certificate /etc/nginx/ssl/taims.crt;
        ssl_certificate_key /etc/nginx/ssl/taims.key;

        # Modern SSL Protocols & Ciphers (Mozilla Modern Recommended)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Security Headers (OWASP Hardening)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 1. Frontend Web Dashboard
        location / {
            proxy_pass http://taims_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        # 2. Backend REST API
        location /api/ {
            proxy_pass http://taims_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
        }

        # 3. MQTT WebSocket Proxy (Port 9001 -> /mqtt)
        location /mqtt {
            proxy_pass http://taims_mqtt_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
