$kind: http-request
url: "{{base_url}}/heartbeat"
method: POST
headers:
  X-API-Key: "{{device_api_key}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "device_id": "NET-SWD-01",
      "status": "online",
      "ip_address": "192.168.1.100",
      "rssi": -58,
      "uptime_seconds": 4500,
      "firmware_version": "v2.1.0"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () { pm.response.to.have.status(200); });
      pm.test('Heartbeat diterima server', function () { pm.expect(pm.response.json().success).to.be.true; });
    language: text/javascript
order: 1000
