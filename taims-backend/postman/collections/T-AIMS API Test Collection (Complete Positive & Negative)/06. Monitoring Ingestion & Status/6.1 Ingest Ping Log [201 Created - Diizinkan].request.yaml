$kind: http-request
url: "{{base_url}}/monitoring/ping"
method: POST
headers:
  X-API-Key: "{{device_api_key}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "asset_id": 3,
      "status": "online",
      "response_time_ms": 2.34,
      "details": {
        "packet_loss": 0
      }
    }
scripts:
  - type: afterResponse
    code: pm.test('Status code is 201 Created', function () { pm.response.to.have.status(201); });
    language: text/javascript
order: 1000
