$kind: http-request
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "admin@taims.local",
      "password": "password_salah_total"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 401 Unauthorized', function () { pm.response.to.have.status(401); });
      var res = pm.response.json();
      pm.test('Ditolak sistem karena password salah', function () { pm.expect(res.success).to.be.false; });
    language: text/javascript
order: 4000
