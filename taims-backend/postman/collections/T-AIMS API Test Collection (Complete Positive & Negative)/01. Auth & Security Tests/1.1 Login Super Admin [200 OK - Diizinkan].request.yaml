$kind: http-request
url: "{{base_url}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "admin@taims.local",
      "password": "password123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      var res = pm.response.json();
      pm.test('Login Super Admin Berhasil', function () { pm.expect(res.success).to.be.true; });
      if (res.data && res.data.token) { pm.collectionVariables.set('token_super_admin', res.data.token); }
    language: text/javascript
order: 1000
