$kind: http-request
url: "{{base_url}}/auth/me"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 401 Unauthorized', function () { pm.response.to.have.status(401); });
      var res = pm.response.json();
      pm.test('Ditolak sistem karena tanpa token', function () { pm.expect(res.success).to.be.false; });
    language: text/javascript
order: 5000
