$kind: http-request
name: 1.7 Profil Saya (GET /me) [200 OK - Diizinkan]
url: "{{base_url}}/auth/me"
method: GET
headers:
  Authorization: Bearer {{token_super_admin}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      pm.test('Data user ditemukan', function () { pm.expect(pm.response.json().data.email).to.be.ok; });
    language: text/javascript
order: 7000
