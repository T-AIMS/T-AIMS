$kind: http-request
url: "{{base_url}}/assets/{{test_asset_id}}"
method: DELETE
headers:
  Authorization: Bearer {{token_admin}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 403 Forbidden', function () { pm.response.to.have.status(403); });
      var res = pm.response.json();
      pm.test('Sistem mencegah role admin menghapus aset', function () { pm.expect(res.error).to.include('tidak bisa delete'); });
    language: text/javascript
order: 4000
