$kind: http-request
url: "{{base_url}}/assets/{{test_asset_id}}"
method: PUT
headers:
  Authorization: Bearer {{token_admin}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "asset_name": "Switch Uji Coba (Updated oleh Admin)",
      "priority": 1
    }
scripts:
  - type: afterResponse
    code: pm.test('Status code is 200 OK', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 3000
