$kind: http-request
url: "{{base_url}}/assets"
method: POST
headers:
  Authorization: Bearer {{token_admin}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "asset_code": "NET-TEST-526",
      "asset_name": "Switch Uji Coba Admin",
      "category": "Switch",
      "ip_address": "192.168.1.250",
      "mac_address": "AA:BB:CC:DD:EE:01",
      "location_id": 1,
      "monitoring_method": "Ping",
      "priority": 2,
      "description": "Aset testing dibuat oleh admin"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 201 Created', function () { pm.response.to.have.status(201); });
      var res = pm.response.json();
      if (res.data && res.data.asset_id) { pm.collectionVariables.set('test_asset_id', res.data.asset_id.toString()); }
    language: text/javascript
order: 1000
