$kind: http-request
url: "{{base_url}}/assets/3"
method: PUT
headers:
  Authorization: Bearer {{token_user}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "asset_name": "Edit Ilegal"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 403 Forbidden', function () { pm.response.to.have.status(403); });
      var res = pm.response.json();
      pm.test('Sistem mencegah role user mengubah data', function () { pm.expect(res.error).to.include('tidak bisa update'); });
    language: text/javascript
order: 3000
