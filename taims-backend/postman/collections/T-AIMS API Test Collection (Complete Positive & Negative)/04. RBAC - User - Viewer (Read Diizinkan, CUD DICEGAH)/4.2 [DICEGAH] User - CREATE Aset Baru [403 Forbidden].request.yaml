$kind: http-request
url: "{{base_url}}/assets"
method: POST
headers:
  Authorization: Bearer {{token_user}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "asset_code": "NET-ILLEGAL-01",
      "asset_name": "Percobaan Tambah oleh User",
      "category": "Server"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 403 Forbidden', function () { pm.response.to.have.status(403); });
      var res = pm.response.json();
      pm.test('Sistem mencegah role user menambah data', function () { pm.expect(res.error).to.include('tidak bisa create'); });
    language: text/javascript
order: 2000
