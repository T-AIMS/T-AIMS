$kind: http-request
url: "{{base_url}}/search?q=net"
method: GET
headers:
  Authorization: Bearer {{token_super_admin}}
queryParams:
  q: net
scripts:
  - type: afterResponse
    code: pm.test('Status code is 200 OK', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 5000
