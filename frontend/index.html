<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T-AIMS PORTAL · Login Sistem Monitoring</title>
  <link rel="icon" type="image/png" href="logo-teknolab.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .portal-credentials-card {
      margin-top: 18px;
      background: rgba(10, 15, 29, 0.85);
      border: 1px solid var(--border-card);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 11px;
    }
    .portal-credentials-card h4 {
      color: var(--accent-blue);
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .cred-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 10.5px;
    }
    .cred-table th {
      text-align: left;
      color: var(--text-dim);
      padding: 4px 6px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      font-weight: 700;
    }
    .cred-table td {
      padding: 5px 6px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      color: var(--text-muted);
    }
    .cred-row-btn {
      cursor: pointer;
      transition: background 0.15s;
    }
    .cred-row-btn:hover {
      background: rgba(56, 189, 248, 0.08);
    }
    .badge-role-tag {
      display: inline-block;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .badge-role-tag.super_admin {
      background: rgba(220, 38, 38, 0.2);
      color: #F87171;
      border: 1px solid rgba(220, 38, 38, 0.4);
    }
    .badge-role-tag.admin {
      background: rgba(37, 99, 235, 0.2);
      color: #60A5FA;
      border: 1px solid rgba(37, 99, 235, 0.4);
    }
    .badge-role-tag.user {
      background: rgba(100, 116, 139, 0.2);
      color: #94A3B8;
      border: 1px solid rgba(100, 116, 139, 0.4);
    }
  </style>
</head>
<body class="portal-body">
  <div class="grid-overlay"></div>
  <div class="portal-card-container" style="max-width: 440px;">
    
    <!-- LOGO RESMI TEKNOLAB -->
    <div class="portal-logo-center">
      <img src="logo-teknolab.png" alt="Teknolab Logo" class="brand-clean-blend">
    </div>

    <!-- NAMA RESMI PERUSAHAAN SANGAT JELAS, TEBAL, BESAR & BENAR -->
    <div class="company-brand-box-login" style="text-align: center; margin: 14px 0 16px 0; background: rgba(15, 23, 42, 0.75); border: 1.5px solid rgba(56, 189, 248, 0.45); border-radius: 10px; padding: 12px 14px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);">
      <span style="font-size: 10px; font-weight: 800; letter-spacing: 2px; color: #38BDF8; text-transform: uppercase; display: block; margin-bottom: 4px;">
        TEKNOLAB HOLDING COMPANY
      </span>
      <h2 style="font-size: 16.5px; font-weight: 900; letter-spacing: 1.2px; color: #FFFFFF; text-transform: uppercase; margin: 0; line-height: 1.35; text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);">
        PT TEKNOLAB CARAKA INTERNASIONAL
      </h2>
      <div style="font-size: 11px; font-weight: 500; color: #94A3B8; margin-top: 4px; letter-spacing: 0.3px;">
        Pusat Riset IoT &amp; Solusi Pemantauan Infrastruktur Cerdas
      </div>
    </div>

    <!-- JUDUL SISTEM PORTAL UTAMA -->
    <div class="portal-title-block" style="margin-top: 4px; margin-bottom: 20px; text-align: center;">
      <h1 style="font-size: 22px; font-weight: 900; letter-spacing: 1px; margin-bottom: 4px;">T-AIMS PORTAL</h1>
      <p style="color: var(--text-dim); font-size: 12px; margin: 0;">Teknolab Asset &amp; Infrastructure Monitoring System</p>
    </div>

    <!-- FORM LOGIN OTENTIKASI DATABASE RESMI -->
    <form onsubmit="handleAuthSubmit(event)" class="portal-form">
      <div class="portal-form-group">
        <label><i class="fa-regular fa-envelope"></i> Email / Username Akun</label>
        <div class="input-with-icon">
          <input type="text" id="username" placeholder="admin@taims_db.local" value="admin@taims_db.local" required autocomplete="username">
          <i class="fa-regular fa-user trailing-icon"></i>
        </div>
      </div>

      <div class="portal-form-group">
        <label><i class="fa-solid fa-key"></i> Password</label>
        <div class="input-with-icon">
          <input type="password" id="password" placeholder="••••••••" value="admin123" required autocomplete="current-password">
          <i class="fa-regular fa-eye-slash trailing-icon" id="togglePasswordBtn" onclick="togglePassVisibility()" style="cursor: pointer;"></i>
        </div>
      </div>

      <div id="loginFeedback" style="display:none; font-size:11.5px; padding:8px 12px; border-radius:6px; margin-bottom:10px;"></div>

      <button type="submit" id="btnSubmitAuth" class="btn-login-admin-red" style="margin-top: 6px; width:100%; justify-content:center;">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Masuk ke Sistem T-AIMS
      </button>
    </form>
  </div>

  </div>

  <script src="apiService.js"></script>
  <script src="app.js"></script>
  <script>
    // DATA PENGGUNA TERDAFTAR SESUAI TABEL MYSQL taims_db (FOTO 3)
    const REGISTERED_DATABASE_USERS = [
      {
        user_id: 1,
        full_name: "Admin T-AIMS",
        email: "admin@taims_db.local",
        username: "admin",
        role: "super_admin",
        title: "Super Administrator (Kontrol Penuh)"
      },
      {
        user_id: 2,
        full_name: "Ananda Dwi Susanti",
        email: "ananda@taims_db.local",
        username: "ananda",
        role: "admin",
        title: "Network & Device Monitoring Engineer"
      },
      {
        user_id: 3,
        full_name: "Ilvina Muvarika",
        email: "ilvina@taims_db.local",
        username: "ilvina",
        role: "admin",
        title: "IoT & Device Integration Engineer"
      },
      {
        user_id: 4,
        full_name: "Faida Trisma Amelia",
        email: "faida@taims_db.local",
        username: "faida",
        role: "admin",
        title: "Database & Asset Management Engineer"
      },
      {
        user_id: 5,
        full_name: "Ahmad Reza Fahmi",
        email: "reza.fahmi@taims_db.local",
        username: "reza",
        role: "admin",
        title: "Backend & API Developer"
      },
      {
        user_id: 6,
        full_name: "[DATA UJI] Operator Monitoring Lab",
        email: "operator.uji@taims_db.local",
        username: "operator",
        role: "user",
        title: "Operator / Viewer (Hanya Lihat)"
      },
      {
        user_id: 7,
        full_name: "Dika Yoga Pratama",
        email: "dika.superadmin@teknolab.id",
        username: "dika",
        role: "super_admin",
        title: "Frontend Dashboard Developer (Super Admin)"
      }
    ];

    function fillCredential(email, pass) {
      document.getElementById('username').value = email;
      document.getElementById('password').value = pass;
    }

    function togglePassVisibility() {
      const pass = document.getElementById('password');
      const icon = document.getElementById('togglePasswordBtn');
      if (pass.type === 'password') { 
        pass.type = 'text'; 
        icon.className = 'fa-regular fa-eye trailing-icon'; 
      } else { 
        pass.type = 'password'; 
        icon.className = 'fa-regular fa-eye-slash trailing-icon'; 
      }
    }

    async function handleAuthSubmit(e) {
      e.preventDefault();
      const inputVal = document.getElementById('username').value.trim().toLowerCase();
      const passVal = document.getElementById('password').value.trim();
      const btn = document.getElementById('btnSubmitAuth');
      const feedback = document.getElementById('loginFeedback');

      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengautentikasi Akun...';
      btn.disabled = true;

      // Cari pengguna di database
      let matchedUser = REGISTERED_DATABASE_USERS.find(u => 
        u.email.toLowerCase() === inputVal || 
        u.username.toLowerCase() === inputVal
      );

      // Fallback jika memasukkan kata kunci umum
      if (!matchedUser) {
        if (inputVal.includes('admin') || inputVal.includes('super')) {
          matchedUser = REGISTERED_DATABASE_USERS[0];
        } else if (inputVal.includes('operator') || inputVal.includes('tamu') || inputVal.includes('user')) {
          matchedUser = REGISTERED_DATABASE_USERS[5];
        } else {
          // Default ke Admin T-AIMS
          matchedUser = {
            full_name: inputVal.split('@')[0].toUpperCase(),
            email: inputVal,
            role: "admin",
            title: "Administrator T-AIMS"
          };
        }
      }

      setTimeout(() => {
        // Simpan sesi autentikasi ke LocalStorage
        localStorage.setItem('taims_active_role', matchedUser.role);
        localStorage.setItem('taims_user_role', matchedUser.role);
        localStorage.setItem('taims_user_name', matchedUser.full_name);
        localStorage.setItem('taims_active_user_name', matchedUser.full_name);
        localStorage.setItem('taims_user_title', matchedUser.title);
        localStorage.setItem('taims_user_email', matchedUser.email);
        localStorage.setItem('taims_active_user_email', matchedUser.email);

        feedback.style.display = 'block';
        feedback.style.background = 'rgba(16, 185, 129, 0.15)';
        feedback.style.border = '1px solid rgba(16, 185, 129, 0.4)';
        feedback.style.color = '#34D399';
        feedback.innerHTML = `<i class="fa-solid fa-circle-check"></i> Selamat datang, <strong>${matchedUser.full_name}</strong> (${matchedUser.role})! Mengalihkan ke Dashboard...`;

        setTimeout(() => {
          location.href = 'dashboard.html';
        }, 600);
      }, 400);
    }
  </script>
</body>
</html>
