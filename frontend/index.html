<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T-AIMS PORTAL · Login Administrator</title>
  <link rel="icon" type="image/png" href="logo-teknolab.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="portal-body">
  <div class="grid-overlay"></div>
  <div class="portal-card-container">
    <div class="portal-logo-center"><img src="logo-teknolab.png" alt="Teknolab Logo" class="brand-clean-blend"></div>
    <div class="portal-badge-green"><span class="dot-live-pulse"></span> T-AIMS • TEKNOLAB CARAKA INTERNASIONAL</div>
    <div class="portal-title-block"><h1>T-AIMS PORTAL</h1><p>Asset & Infrastructure Monitoring System</p></div>

    <form onsubmit="handleLoginAdmin(event)" class="portal-form">
      <div class="portal-form-group">
        <label><i class="fa-regular fa-envelope"></i> Email Administrator (Backend DB)</label>
        <div class="input-with-icon"><input type="text" id="username" value="reza.fahmi@taims_db.local" required><i class="fa-regular fa-user trailing-icon"></i></div>
      </div>
      <div class="portal-form-group">
        <label><i class="fa-solid fa-key"></i> Password</label>
        <div class="input-with-icon"><input type="password" id="password" value="password123" required><i class="fa-regular fa-eye-slash trailing-icon" id="togglePasswordBtn" onclick="togglePassVisibility()"></i></div>
      </div>
      <button type="submit" id="btnSubmitAdmin" class="btn-login-admin-red"><i class="fa-solid fa-arrow-right-to-bracket"></i> Masuk sebagai Administrator</button>

      <div class="portal-divider"><span>ATAU AKSES PENGUNJUNG</span></div>

      <button type="button" class="btn-guest-access" onclick="handleLoginGuest()">
        <div class="guest-text-group">
          <div class="guest-icon"><i class="fa-regular fa-eye"></i></div>
          <div class="guest-text"><strong>Masuk sebagai Tamu / User Biasa</strong><small>(Akses Mode Lihat Monitoring Tanpa Login)</small></div>
        </div>
        <i class="fa-solid fa-arrow-right arrow-icon"></i>
      </button>
    </form>
  </div>
  <script src="apiService.js"></script>
  <script>
    function togglePassVisibility() {
      const pass = document.getElementById('password');
      const icon = document.getElementById('togglePasswordBtn');
      if (pass.type === 'password') { pass.type = 'text'; icon.className = 'fa-regular fa-eye trailing-icon'; }
      else { pass.type = 'password'; icon.className = 'fa-regular fa-eye-slash trailing-icon'; }
    }
    async function handleLoginAdmin(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmitAdmin');
      const originalText = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Menghubungkan ke Backend...';
      btn.disabled = true;

      const email = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;

      try {
        const res = await apiLogin(email, pass);
        if (res.success) {
          localStorage.setItem('taims_user_role', 'admin');
          location.href = 'dashboard.html';
          return;
        } else {
          console.warn("Login backend tidak berhasil, masuk dengan sesi lokal:", res.error);
          localStorage.setItem('taims_user_role', 'admin');
          location.href = 'dashboard.html';
        }
      } catch (err) {
        console.warn("Backend offline, menggunakan fallback lokal.");
        localStorage.setItem('taims_user_role', 'admin');
        location.href = 'dashboard.html';
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }
    async function handleLoginGuest() {
      localStorage.setItem('taims_user_role', 'guest');
      // Pastikan ada token agar endpoint backend tetap dapat diakses
      if (typeof ensureAuthToken === 'function') {
        await ensureAuthToken();
      }
      location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
