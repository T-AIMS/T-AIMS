$kind: http-request
url: "{{base_url}}/locations/{{test_location_id}}"
method: DELETE
headers:
  Authorization: Bearer {{token_super_admin}}
scripts:
  - type: afterResponse
    code: pm.test('Status code is 200 OK', function () { pm.response.to.have.status(200); });
    language: text/javascript
order: 4000
