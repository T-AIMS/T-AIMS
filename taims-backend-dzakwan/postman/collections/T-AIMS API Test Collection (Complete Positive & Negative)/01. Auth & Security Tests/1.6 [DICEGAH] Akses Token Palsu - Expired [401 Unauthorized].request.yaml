$kind: http-request
name: 1.6 [DICEGAH] Akses Token Palsu / Expired [401 Unauthorized]
url: "{{base_url}}/auth/me"
method: GET
headers:
  Authorization: "{{bearer_token_0zfv}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 401 Unauthorized', function () { pm.response.to.have.status(401); });
      var res = pm.response.json();
      pm.test('Ditolak sistem karena token palsu', function () { pm.expect(res.success).to.be.false; });
    language: text/javascript
order: 6000
