$kind: http-request
url: "{{base_url}}/monitoring/ping"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "asset_id": 3,
      "status": "online",
      "response_time_ms": 5
    }
scripts:
  - type: afterResponse
    code: pm.test('Status code is 401', function () { pm.response.to.have.status(401); });
    language: text/javascript
order: 2000
